{% extends "base.html" %}

{% block title %}Register - Respiratory AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow">
            <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                <h3 class="text-white mb-0">
                    <i class="fas fa-user-plus me-2"></i>Join Us
                </h3>
                <p class="text-white-50 mt-2 mb-0">Create your account</p>
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required placeholder="Choose a username">
                        </div>
                        <div class="form-text">At least 3 characters</div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Email <span class="text-muted">(Optional)</span></label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required placeholder="Create a password">
                        </div>
                        <div class="form-text">At least 6 characters</div>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-lg" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); border: none; color: white;">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </div>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-0">Already have an account?</p>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-secondary mt-2">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
